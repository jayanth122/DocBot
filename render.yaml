# Render deployment config
services:
  - type: web
    name: docbot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --worker-class sync --timeout 60 --graceful-timeout 10 --bind 0.0.0.0:10000 --access-logfile - --error-logfile -
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: LLM_MAX_RETRIES
        value: "0"
      - key: LLM_REQUEST_TIMEOUT_SECONDS
        value: "12"
      - key: LLM_TOTAL_TIMEOUT_SECONDS
        value: "25"
      - key: ENABLE_RAG_REFINE
        value: "false"
      - key: EMBED_BATCH_SIZE
        value: "8"
      - key: FRONTEND_URL
        sync: false

  - type: cron
    name: docbot-keep-warm
    schedule: "*/14 * * * *"
    buildCommand: pip install requests
    startCommand: |
      python - <<'PY'
      import requests
      import os
      backend_url = os.getenv("BACKEND_URL", "https://docbot-e1ft.onrender.com")
      try:
        requests.get(f"{backend_url}/health", timeout=5)
        print("✓ Kept backend warm")
      except Exception as e:
        print(f"✗ Keep-warm ping failed: {e}")
      PY
    envVars:
      - key: BACKEND_URL
        sync: false
