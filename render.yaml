# Render deployment config
services:
  - type: web
    name: docbot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120 --graceful-timeout 30 --keep-alive 5
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: LLM_MAX_RETRIES
        value: "1"
      - key: LLM_REQUEST_TIMEOUT_SECONDS
        value: "20"
      - key: LLM_TOTAL_TIMEOUT_SECONDS
        value: "35"
      - key: FRONTEND_URL
        sync: false
